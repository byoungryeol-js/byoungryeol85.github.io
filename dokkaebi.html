<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>도깨비 야행 · 잡귀 물리치기 서바이벌</title>
<meta name="theme-color" content="#1a1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gugi&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #2a1f2d;
        --paper: #f6ecd4;
        --paper2: #eadbb8;
        --red: #d8392f;
        --blue: #2f5fb3;
        --yellow: #f2b632;
        --green: #3f8f5a;
        --white: #fffaf0;
        --top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1a1420; color: var(--ink);
        font-family: "Do Hyeon", "Pretendard", system-ui, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hidden { display: none !important; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #xpbar {
        position: absolute; left: 8px; right: 8px; top: calc(8px + var(--top)); height: 16px;
        background: #2a1f2d; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden;
        box-shadow: 0 2px 0 rgba(0,0,0,.35);
    }
    #xpfill { height: 100%; width: 0; background: linear-gradient(#9bdcff, #3a86e8 60%, #2c63c4); transition: width .12s linear; }
    #lvl {
        position: absolute; right: 8px; top: 0; line-height: 12px; font-size: 13px; color: #fff;
        text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
    }
    #slots { position: absolute; left: 8px; top: calc(30px + var(--top)); display: grid; grid-template-columns: repeat(5, 26px); gap: 3px; }
    .slot {
        width: 26px; height: 26px; border-radius: 7px; position: relative;
        background: rgba(246,236,212,.92); border: 2px solid var(--ink);
    }
    .slot.empty { background: rgba(42,31,45,.35); border-color: rgba(42,31,45,.5); }
    .slot canvas { width: 100%; height: 100%; display: block; }
    .slot b {
        position: absolute; right: -4px; bottom: -5px; font-weight: 400; font-size: 10px; line-height: 12px;
        background: var(--ink); color: #fff; border-radius: 4px; padding: 0 3px;
    }
    .slot.evo { background: #ffe79a; }
    .slot.evo b { background: var(--red); }
    #timer {
        position: absolute; left: 50%; transform: translateX(-50%); top: calc(28px + var(--top));
        font-family: "Gugi", serif; font-size: 28px; color: #fff; letter-spacing: 1px;
        text-shadow: 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 0 4px 0 var(--ink);
    }
    #kills {
        position: absolute; right: 54px; top: calc(34px + var(--top)); font-size: 17px; color: #fff;
        text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 2px 0 var(--ink);
    }
    #pauseBtn {
        pointer-events: auto; position: absolute; right: 8px; top: calc(30px + var(--top));
        width: 40px; height: 40px; border-radius: 10px; font-size: 16px;
        background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    }
    #pauseBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    #bossbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(70px + var(--top)); width: min(330px, 66vw); text-align: center; }
    #bossbar .name {
        font-family: "Gugi", serif; font-size: 16px; color: #ffe3e3; margin-bottom: 3px;
        text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
    }
    #bossbar .bar { height: 12px; background: #2a1f2d; border: 2px solid var(--ink); border-radius: 7px; overflow: hidden; }
    #bossbar .fill { height: 100%; width: 100%; background: linear-gradient(#ff7a6a, #c8223a); transition: width .15s; }

    #banner {
        position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 6;
        opacity: 0;
    }
    #banner.show { animation: banner 2.6s ease forwards; }
    #banner .big {
        display: inline-block; font-family: "Gugi", serif; font-size: clamp(26px, 8vw, 44px); color: #fff;
        padding: 6px 22px; background: rgba(42,31,45,.82); border-top: 4px solid var(--red); border-bottom: 4px solid var(--red);
        text-shadow: 0 3px 0 var(--ink);
    }
    #banner .small { margin-top: 8px; font-size: 18px; color: #ffe9b0; text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); }
    @keyframes banner {
        0% { opacity: 0; transform: scale(1.4); }
        10% { opacity: 1; transform: scale(1); }
        80% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(.96); }
    }

    /* ---------- 오버레이 ---------- */
    .overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: calc(16px + var(--top)) 16px 16px;
        background: rgba(26,20,32,.5);
        overflow-y: auto;
    }
    .panel {
        position: relative; width: 100%; max-width: 420px;
        background:
            radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 40%),
            repeating-linear-gradient(17deg, rgba(120,90,40,.035) 0 2px, transparent 2px 7px),
            var(--paper);
        border: 3px solid var(--ink); border-radius: 16px;
        box-shadow: 0 6px 0 var(--ink), 0 18px 40px rgba(0,0,0,.45);
        padding: 0 16px 16px; overflow: hidden;
    }
    .dancheong {
        height: 14px; margin: 0 -16px 14px;
        background:
            repeating-linear-gradient(90deg, var(--red) 0 16px, var(--blue) 16px 32px, var(--yellow) 32px 48px, var(--green) 48px 64px, var(--white) 64px 80px);
        border-bottom: 3px solid var(--ink);
    }
    .ptitle { font-family: "Gugi", serif; font-size: 22px; text-align: center; margin: 4px 0 12px; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 10px 18px; border-radius: 12px; font-size: 19px;
        background: var(--white); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
        transition: transform .08s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .btn.red { background: var(--red); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.big { width: 100%; font-size: 26px; font-family: "Gugi", serif; padding: 12px; }
    .btn.ghost { background: transparent; box-shadow: none; border-width: 2px; font-size: 16px; padding: 6px 12px; }
    .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

    /* 타이틀 */
    .title-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .logo { font-family: "Gugi", serif; line-height: .95; text-align: center; margin-top: 4px; }
    .logo span {
        display: block; font-size: clamp(56px, 18vw, 88px); paint-order: stroke fill;
        -webkit-text-stroke: 8px var(--ink);
        filter: drop-shadow(0 6px 0 var(--ink));
    }
    .logo .l1 { color: var(--red); transform: rotate(-4deg); }
    .logo .l2 { color: var(--yellow); transform: rotate(3deg) translateX(18px); }
    .tagline {
        font-size: 17px; color: #fff; text-align: center;
        text-shadow: 0 2px 0 var(--ink), 0 0 8px var(--ink);
    }
    .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .char {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 8px 4px 10px; border-radius: 12px; text-align: center;
        background: rgba(255,255,255,.55); border: 3px solid rgba(42,31,45,.25);
    }
    .char canvas { width: 72px; height: 72px; }
    .char .nm { font-family: "Gugi", serif; font-size: 20px; }
    .char .pk { font-size: 13px; color: #6a5a4a; line-height: 1.25; }
    .char .wp { display: flex; align-items: center; gap: 2px; font-size: 13px; }
    .char .wp canvas { width: 20px; height: 20px; }
    .char.sel { border-color: var(--ink); background: #fff8e2; box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
    .title-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; font-size: 15px; }
    .howto { margin-top: 10px; font-size: 14px; color: #6a5a4a; text-align: center; }
    .back { color: #fff; font-size: 16px; text-decoration: none; text-shadow: 0 2px 0 var(--ink); }

    /* 레벨업 */
    .lv-head { text-align: center; }
    .lv-head .t { font-family: "Gugi", serif; font-size: 30px; color: var(--red); }
    .lv-head .s { font-size: 15px; color: #6a5a4a; margin-bottom: 10px; }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
        display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
        padding: 9px 12px; border-radius: 12px;
        background: #fffaf0; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
        animation: pop .25s ease backwards;
    }
    .choice:nth-child(2) { animation-delay: .05s; }
    .choice:nth-child(3) { animation-delay: .1s; }
    .choice:nth-child(4) { animation-delay: .15s; }
    .choice:hover { background: #fff1c9; }
    .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .choice .ic { flex: 0 0 52px; height: 52px; border-radius: 10px; background: var(--paper2); border: 2px solid var(--ink); display: grid; place-items: center; }
    .choice .ic canvas { width: 44px; height: 44px; }
    .choice .tx { flex: 1; min-width: 0; }
    .choice .nm { font-size: 20px; display: flex; align-items: center; gap: 6px; }
    .choice .tag { font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--ink); color: #fff; }
    .choice .tag.new { background: var(--red); }
    .choice .tag.evo { background: var(--yellow); color: var(--ink); }
    .choice .ds { font-size: 15px; color: #5d4d40; line-height: 1.3; }
    .choice .hint { font-size: 12px; color: #a0522d; margin-top: 2px; }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.96); } }

    /* 보물함 */
    .chest-box { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .rays {
        width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center;
        background: repeating-conic-gradient(rgba(242,182,50,.55) 0 12deg, transparent 12deg 30deg);
        animation: spin 8s linear infinite;
    }
    .rays > div { animation: spin 8s linear infinite reverse; }
    .rays canvas { width: 96px; height: 96px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loot { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .loot .row { display: flex; align-items: center; gap: 10px; background: #fffaf0; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; text-align: left; }
    .loot .row canvas { width: 36px; height: 36px; flex: 0 0 36px; }
    .loot .nm { font-size: 18px; }
    .loot .ds { font-size: 14px; color: #5d4d40; }
    .loot .big { font-family: "Gugi", serif; color: var(--red); }

    /* 일시정지·결과 */
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .toggles { display: flex; gap: 8px; }
    .toggles .btn { flex: 1; font-size: 17px; }
    .build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 6px; }
    .build .it { position: relative; width: 38px; height: 38px; border-radius: 8px; background: var(--paper2); border: 2px solid var(--ink); }
    .build .it canvas { width: 100%; height: 100%; }
    .build .it b { position: absolute; right: -4px; bottom: -6px; font-weight: 400; font-size: 11px; background: var(--ink); color: #fff; border-radius: 4px; padding: 0 4px; }
    .end-title { font-family: "Gugi", serif; font-size: 34px; text-align: center; }
    .end-sub { text-align: center; color: #6a5a4a; font-size: 16px; margin-bottom: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .stats div { background: #fffaf0; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 4px; text-align: center; }
    .stats b { display: block; font-family: "Gugi", serif; font-size: 22px; font-weight: 400; }
    .stats span { font-size: 13px; color: #6a5a4a; }
    .record { text-align: center; color: var(--red); font-size: 16px; margin-bottom: 10px; min-height: 1em; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><span id="lvl">Lv 1</span></div>
    <div id="slots"></div>
    <div id="timer">00:00</div>
    <div id="kills">처치 0</div>
    <button id="pauseBtn" aria-label="일시정지">❚❚</button>
    <div id="bossbar" class="hidden"><div class="name"></div><div class="bar"><div class="fill"></div></div></div>
</div>
<div id="banner"><div class="big"></div><div class="small"></div></div>

<!-- 타이틀 -->
<div class="overlay" id="titleScr">
    <div class="title-wrap">
        <div class="logo"><span class="l1">도깨비</span><span class="l2">야행</span></div>
        <div class="tagline">해가 지면 잡귀가 몰려온다! · 10분을 버텨라</div>
        <div class="panel">
            <div class="dancheong"></div>
            <div class="ptitle">어떤 도깨비로 나갈까?</div>
            <div class="chars" id="chars"></div>
            <button class="btn red big" id="startBtn">출발!</button>
            <div class="title-foot">
                <button class="btn ghost" id="soundBtn">소리 켬</button>
                <span id="best"></span>
            </div>
            <div class="howto">이동: 화면을 끌거나 WASD·방향키 · 공격은 저절로!</div>
        </div>
        <a class="back" href="index.html">← 게임 목록</a>
    </div>
</div>

<!-- 레벨업 -->
<div class="overlay hidden" id="levelScr">
    <div class="panel">
        <div class="dancheong"></div>
        <div class="lv-head"><div class="t">레벨 업!</div><div class="s" id="lvSub">도깨비 보따리에서 하나를 고르세요</div></div>
        <div class="choices" id="choices"></div>
    </div>
</div>

<!-- 보물함 -->
<div class="overlay hidden" id="chestScr">
    <div class="panel">
        <div class="dancheong"></div>
        <div class="chest-box">
            <div class="ptitle" id="chestTitle">도깨비 보물함!</div>
            <div class="rays"><div id="chestIcon"></div></div>
            <div class="loot" id="loot"></div>
            <button class="btn red big" id="chestBtn">받기</button>
        </div>
    </div>
</div>

<!-- 일시정지 -->
<div class="overlay hidden" id="pauseScr">
    <div class="panel">
        <div class="dancheong"></div>
        <div class="ptitle">잠시 쉬어가기</div>
        <div class="build" id="pauseBuild"></div>
        <div class="stack">
            <button class="btn red big" id="resumeBtn">계속하기</button>
            <div class="toggles">
                <button class="btn" id="sfxBtn">효과음 켬</button>
                <button class="btn" id="musBtn">음악 켬</button>
            </div>
            <button class="btn ghost" id="quitBtn">포기하고 처음으로</button>
        </div>
    </div>
</div>

<!-- 결과 -->
<div class="overlay hidden" id="endScr">
    <div class="panel">
        <div class="dancheong"></div>
        <div class="end-title" id="endTitle"></div>
        <div class="end-sub" id="endSub"></div>
        <div class="stats" id="endStats"></div>
        <div class="build" id="endBuild"></div>
        <div class="record" id="endRecord"></div>
        <div class="stack">
            <button class="btn red big hidden" id="contBtn">계속 버티기 (무한)</button>
            <button class="btn" id="retryBtn">다시 하기</button>
            <button class="btn ghost" id="homeBtn">처음으로</button>
        </div>
    </div>
</div>

<script>
'use strict';
/* =========================================================================
   도깨비 야행 — 한국 설화풍 뱀서라이크
   이동만 하면 무기가 알아서 공격한다. 10분을 버티면 승리.
   ========================================================================= */
const TAU = Math.PI * 2, INK = '#2a1f2d';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(list) { let s = 0; for (const x of list) s += x[1]; let r = Math.random() * s; for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; } return list[0][0]; }
function fmtTime(t) { t = Math.floor(t); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
const store = {
    get(k, d) { try { const v = localStorage.getItem('dkb.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('dkb.' + k, JSON.stringify(v)); } catch (e) { } },
};

/* ---------- 캔버스 그리기 도우미 ---------- */
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function fs(g, fill) { g.fillStyle = fill; g.fill(); g.stroke(); }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function tri(g, a, b, c, d, e, f) { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.closePath(); g.fill(); g.stroke(); }
function shade(g, path, fill, shadeCol, sx, sy, srx, sry) {
    // 채우고 → 안쪽 그림자 → 외곽선 (먹선 셀 셰이딩)
    path(); g.fillStyle = fill; g.fill();
    g.save(); path(); g.clip(); g.fillStyle = shadeCol; ell(g, sx, sy, srx, sry); g.fill(); g.restore();
    path(); g.stroke();
}

function horn(g, x, y, rot, len) {
    g.save(); g.translate(x, y); g.rotate(rot); g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(-3.4, 3); g.quadraticCurveTo(-3, -len * 0.6, 0.6, -len); g.quadraticCurveTo(2, -len * 0.45, 3.4, 3); g.closePath();
    fs(g, '#f6e9c8'); g.restore();
}
function eye(g, x, y, rx, ry, dx, iris) {
    g.lineWidth = 1.8; ell(g, x, y, rx, ry); fs(g, '#fff');
    if (iris) { g.fillStyle = iris; ell(g, x + dx * 0.8, y + 0.3, rx * 0.7, ry * 0.72); g.fill(); }
    g.fillStyle = INK; ell(g, x + dx, y + 0.5, rx * 0.46, ry * 0.52); g.fill();
    g.fillStyle = '#fff'; circ(g, x + dx + rx * 0.15, y - ry * 0.2, Math.max(0.7, rx * 0.2)); g.fill();
}
/* 방망이: +x 방향으로 길이 L */
function drawClub(g, L, gold) {
    const w = L * 0.13; g.strokeStyle = INK; g.lineWidth = Math.max(1.6, L * 0.05);
    g.fillStyle = '#6e4320'; g.beginPath(); g.rect(0, -w * 0.45, L * 0.4, w * 0.9); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(L * 0.32, -w * 0.62); g.lineTo(L * 0.84, -w * 1.5); g.quadraticCurveTo(L * 1.06, 0, L * 0.84, w * 1.5); g.lineTo(L * 0.32, w * 0.62); g.closePath();
    fs(g, gold ? '#f5c542' : '#b0743d');
    g.fillStyle = gold ? '#fff2a8' : '#d69c62';
    g.beginPath(); g.moveTo(L * 0.4, -w * 0.5); g.lineTo(L * 0.8, -w * 1.15); g.lineTo(L * 0.86, -w * 0.6); g.lineTo(L * 0.42, -w * 0.1); g.closePath(); g.fill();
    g.lineWidth = Math.max(1, L * 0.03); g.fillStyle = gold ? '#fffbe6' : '#efe6cf';

    ctx.globalAlpha = 0.5 * fade; ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 2; circ(ctx, P.x, P.y, cr * 0.75); ctx.stroke();
    const cols = ['#d8392f', '#2f5fb3', '#f2b632', '#3f8f5a', '#fffaf0'];
    ctx.globalAlpha = fade;
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU + p.t * 2; ctx.fillStyle = cols[i % 5]; circ(ctx, P.x + Math.cos(a) * cr, P.y + Math.sin(a) * cr, 3.2); ctx.fill(); }
    ctx.restore();
}
function drawWind(p) {
    const fade = Math.min(1, (p.life - p.t) * 3, p.t * 5);
    ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = 0.75 * fade;
    ctx.fillStyle = 'rgba(220,245,255,.35)'; ell(ctx, 0, 0, p.r, p.r * 0.75); ctx.fill();
    for (let i = 0; i < 4; i++) {
        const rot = p.t * 9 + i * TAU / 4;
        ctx.strokeStyle = i % 2 ? '#ffffff' : '#9fd8ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0, -i * 3, p.r * (1 - i * 0.18), p.r * 0.45 * (1 - i * 0.15), 0, rot, rot + 2.4); ctx.stroke();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.45, 0, p.t * 9, p.t * 9 + 1.6); ctx.stroke();
    ctx.restore();
}

/* =========================================================================
   HUD · 메뉴
   ========================================================================= */
let hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function hud() {
    const w = Math.round(P.xp / P.xpNext * 1000) / 10 + '%';
    if (hudCache.xp !== w) { hudCache.xp = w; $('xpfill').style.width = w; }
    setText('lvl', 'Lv ' + P.lvl);
    setText('timer', fmtTime(G.time));
    setText('kills', '처치 ' + G.kills);
    if (G.boss && !G.boss.dead) {
        const bw = Math.max(0, G.boss.hp / G.boss.maxHp * 100).toFixed(1) + '%';
        if (hudCache.boss !== bw) { hudCache.boss = bw; document.querySelector('#bossbar .fill').style.width = bw; }
    }
}
function itemName(it) { return it.type === 'w' ? WEAPONS[it.id].name : PASSIVES[it.id].name; }
function refreshSlots() {
    const box = $('slots'); box.innerHTML = '';
    const row = (list, isW) => {
        for (let i = 0; i < MAX_SLOTS; i++) {
            const it = list[i]; const d = document.createElement('div'); d.className = 'slot' + (it ? '' : ' empty') + (it && it.evo ? ' evo' : '');
            if (it) { d.appendChild(iconCanvas(it.evo ? it.id + '_evo' : it.id, 26)); const b = document.createElement('b'); b.textContent = it.evo ? '★' : it.lvl; d.appendChild(b); }
            box.appendChild(d);
        }
    };
    row(P.weapons, true); row(P.passives, false);
}
function buildList(el, size) {
    el.innerHTML = '';
    for (const it of [...P.weapons, ...P.passives]) {
        const d = document.createElement('div'); d.className = 'it';
        d.appendChild(iconCanvas(it.evo ? it.id + '_evo' : it.id, size));
        const b = document.createElement('b'); b.textContent = it.evo ? '★' : 'Lv' + it.lvl; d.appendChild(b);
        el.appendChild(d);
    }
}
const SCREENS = ['titleScr', 'levelScr', 'chestScr', 'pauseScr', 'endScr'];
function showOnly(id) { for (const s of SCREENS) $(s).classList.toggle('hidden', s !== id); }

/* ---------- 레벨업 ---------- */
function makeChoices() {
    const pool = [];
    for (const w of P.weapons) if (w.lvl < MAX_LV) pool.push({ type: 'w', id: w.id, lvl: w.lvl + 1, wt: 1.3 });
    for (const p of P.passives) if (p.lvl < MAX_LV) pool.push({ type: 'p', id: p.id, lvl: p.lvl + 1, wt: 1.1 });
    if (P.weapons.length < MAX_SLOTS) for (const id in WEAPONS) if (!P.weapons.some(w => w.id === id)) pool.push({ type: 'w', id, lvl: 1, wt: 1 });
    if (P.passives.length < MAX_SLOTS) for (const id in PASSIVES) if (!P.passives.some(p => p.id === id)) pool.push({ type: 'p', id, lvl: 1, wt: 0.9 });
    const out = [];
    const n = 3 + (P.lvl % 5 === 0 ? 1 : 0);
    while (out.length < n && pool.length) {
        let s = 0; for (const x of pool) s += x.wt; let r = Math.random() * s, idx = 0;
        for (let i = 0; i < pool.length; i++) { r -= pool[i].wt; if (r <= 0) { idx = i; break; } }
        out.push(pool.splice(idx, 1)[0]);
    }
    if (!out.length) out.push({ type: 'heal' }, { type: 'maxhp' });
    return out;
}
function openLevelUp() {
    G.state = 'levelup'; JOY.on = false; sfx('level');
    $('lvSub').textContent = `Lv ${P.lvl - G.pendingLv + 1} · 도깨비 보따리에서 하나를 고르세요`;
    const box = $('choices'); box.innerHTML = '';
    for (const c of makeChoices()) {
        const b = document.createElement('button'); b.className = 'choice';
        const ic = document.createElement('div'); ic.className = 'ic';
        let name, desc, tag = '', tagCls = '', hint = '';
        if (c.type === 'heal') { ic.appendChild(iconCanvas('tteok', 44)); name = '떡 한 접시'; desc = '체력을 40 회복한다'; }
        else if (c.type === 'maxhp') { ic.appendChild(iconCanvas('maxhp', 44)); name = '기운 차리기'; desc = '최대 체력 +10'; }
        else if (c.type === 'w') {
            const W = WEAPONS[c.id]; ic.appendChild(iconCanvas(c.id, 44)); name = W.name; desc = W.lv[c.lvl - 1];
            tag = c.lvl === 1 ? 'NEW' : 'Lv ' + c.lvl; tagCls = c.lvl === 1 ? 'new' : '';
            if (W.evo) hint = `진화 짝: ${PASSIVES[W.evo.with].name}`;
        } else {
            const Q = PASSIVES[c.id]; ic.appendChild(iconCanvas(c.id, 44)); name = Q.name; desc = Q.desc;
            tag = c.lvl === 1 ? 'NEW' : 'Lv ' + c.lvl; tagCls = c.lvl === 1 ? 'new' : '';
            const pw = EVO_PARTNER[c.id]; if (pw) hint = `진화 짝: ${WEAPONS[pw].name}`;
        }
        const tx = document.createElement('div'); tx.className = 'tx';
        tx.innerHTML = `<div class="nm"></div><div class="ds"></div>${hint ? '<div class="hint"></div>' : ''}`;
        tx.querySelector('.nm').textContent = name;
        if (tag) { const t = document.createElement('span'); t.className = 'tag ' + tagCls; t.textContent = tag; tx.querySelector('.nm').appendChild(t); }
        tx.querySelector('.ds').textContent = desc;
        if (hint) tx.querySelector('.hint').textContent = hint;
        b.append(ic, tx);
        b.addEventListener('click', () => choose(c));
        box.appendChild(b);
    }
    showOnly('levelScr');
    setTimeout(() => { const f = box.querySelector('button'); if (f) f.focus({ preventScroll: true }); }, 50);
}
function choose(c) {
    if (G.state !== 'levelup') return;
    if (c.type === 'heal') P.hp = Math.min(P.maxHp, P.hp + 40);
    else if (c.type === 'maxhp') { P.C = Object.assign({}, P.C, { perkFn: ((f) => p => { f(p); p.maxHp += 10; })(P.C.perkFn) }); }
    else if (c.type === 'w') { const w = P.weapons.find(x => x.id === c.id); if (w) w.lvl++; else addWeapon(c.id); }
    else { const p = P.passives.find(x => x.id === c.id); if (p) p.lvl++; else P.passives.push({ id: c.id, lvl: 1 }); }
    recalc(); refreshSlots();
    G.pendingLv--;
    G.parts.push({ x: P.x, y: P.y, t: 0, life: 0.5, s: 14, c: '#ffe28a', k: 'ring' });
    if (G.pendingLv > 0) openLevelUp();
    else { G.state = 'play'; showOnly(null); }
}

/* ---------- 보물함 ---------- */
function evoReady(w) { const d = WEAPONS[w.id].evo; return d && !w.evo && w.lvl >= MAX_LV && P.passives.some(p => p.id === d.with); }
function openChest(isBoss) {
    G.state = 'chest'; JOY.on = false; sfx('chest');
    const res = [];
    const w = P.weapons.find(evoReady);
    if (w) { w.evo = true; res.push({ icon: w.id + '_evo', name: WEAPONS[w.id].evo.name, sub: '진화!', desc: WEAPONS[w.id].evo.desc }); }
    const n = isBoss ? (w ? 2 : 3) : (w ? 0 : 1);
    for (let i = 0; i < n; i++) {
        const ups = [...P.weapons.filter(x => x.lvl < MAX_LV).map(x => ['w', x]), ...P.passives.filter(x => x.lvl < MAX_LV).map(x => ['p', x])];
        if (!ups.length) break;
        const [ty, it] = ups[Math.floor(Math.random() * ups.length)]; it.lvl++;
        res.push({ icon: it.id, name: ty === 'w' ? WEAPONS[it.id].name : PASSIVES[it.id].name, sub: 'Lv ' + it.lvl, desc: ty === 'w' ? WEAPONS[it.id].lv[it.lvl - 1] : PASSIVES[it.id].desc });
    }
    if (!res.length) { P.hp = P.maxHp; res.push({ icon: 'tteok', name: '잔칫상', sub: '', desc: '체력을 모두 회복했다' }); }
    recalc(); refreshSlots();
    $('chestTitle').textContent = w ? '무기가 진화했다!' : '도깨비 보물함!';
    const ic = $('chestIcon'); ic.innerHTML = ''; ic.appendChild(iconCanvas(res[0].icon, 96));
    const loot = $('loot'); loot.innerHTML = '';
    for (const r of res) {
        const row = document.createElement('div'); row.className = 'row';
        row.appendChild(iconCanvas(r.icon, 36));
        const tx = document.createElement('div');
        const nm = document.createElement('div'); nm.className = 'nm' + (r.sub === '진화!' ? ' big' : ''); nm.textContent = r.name + (r.sub ? ' · ' + r.sub : '');
        const ds = document.createElement('div'); ds.className = 'ds'; ds.textContent = r.desc;
        tx.append(nm, ds); row.appendChild(tx); loot.appendChild(row);
    }
    showOnly('chestScr');
    setTimeout(() => $('chestBtn').focus({ preventScroll: true }), 50);
}
$('chestBtn').addEventListener('click', () => { if (G.state !== 'chest') return; G.state = 'play'; showOnly(null); });

/* ---------- 일시정지 · 결과 ---------- */
function pause() {
    if (G.state !== 'play') return;
    G.state = 'pause'; JOY.on = false; buildList($('pauseBuild'), 38); showOnly('pauseScr');
}
function resume() { if (G.state !== 'pause') return; G.state = 'play'; showOnly(null); }
function showEnd(won) {
    AU.playing = won && !G.endless ? AU.playing : false;
    JOY.on = false;
    const best = store.get('best', null);
    const rec = { time: Math.floor(G.time), kills: G.kills, lvl: P.lvl, char: P.C.name };
    let newRec = false;
    if (!best || rec.time > best.time || (rec.time === best.time && rec.kills > best.kills)) { store.set('best', rec); newRec = true; }
    $('endTitle').textContent = won ? '야행을 이겨냈다!' : '도깨비가 쓰러졌다…';
    $('endTitle').style.color = won ? 'var(--red)' : 'var(--ink)';
    $('endSub').textContent = won ? '동이 텄다! 잡귀들이 물러간다' : (G.endless ? '끝없는 밤을 버텼다' : '다음 밤엔 더 오래 버텨보자');
    $('endStats').innerHTML = '';
    for (const [v, l] of [[fmtTime(G.time), '버틴 시간'], [P.lvl, '레벨'], [G.kills, '처치']]) {
        const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = v; const s = document.createElement('span'); s.textContent = l; d.append(b, s); $('endStats').appendChild(d);
    }
    buildList($('endBuild'), 38);
    $('endRecord').textContent = newRec ? '★ 새 최고 기록! ★' : best ? `최고 기록 ${fmtTime(best.time)} · ${best.kills}마리` : '';
    $('contBtn').classList.toggle('hidden', !won);
    showOnly('endScr');
}
function toTitle() {
    G.state = 'title'; AU.playing = false; P = null; G.enemies = []; G.projs = []; G.gems = []; G.items = []; G.bullets = [];
    $('hud').classList.add('hidden'); showOnly('titleScr'); renderBest();
}
function renderBest() { const b = store.get('best', null); $('best').textContent = b ? `최고 ${fmtTime(b.time)} · ${b.kills}마리` : ''; }

/* ---------- 타이틀 ---------- */
function buildTitle() {
    const box = $('chars'); box.innerHTML = '';
    CHARS.forEach((C, i) => {
        const b = document.createElement('button'); b.className = 'char' + (i === G.charIdx ? ' sel' : '');
        b.appendChild(portraitCanvas(C, 72));
        const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = C.name;
        const wp = document.createElement('div'); wp.className = 'wp'; wp.appendChild(iconCanvas(C.weapon, 20)); wp.append(WEAPONS[C.weapon].name);
        const pk = document.createElement('div'); pk.className = 'pk'; pk.textContent = C.perk;
        b.append(nm, wp, pk);
        b.addEventListener('click', () => { G.charIdx = i; store.set('char', i); buildTitle(); audioInit(); });
        box.appendChild(b);
    });
}

/* ---------- 입력 ---------- */
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Escape' || e.code === 'KeyP') { if (G.state === 'play') pause(); else if (G.state === 'pause') resume(); }
    if (G.state === 'levelup' && /^Digit[1-4]$/.test(e.code)) { const b = $('choices').children[+e.code.slice(5) - 1]; if (b) b.click(); }
    if (G.state === 'title' && (e.code === 'Enter' || e.code === 'Space') && document.activeElement === document.body) startGame();
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cvs.addEventListener('pointerdown', e => {
    audioInit();
    if (G.state !== 'play') return;
    JOY.on = true; JOY.id = e.pointerId; JOY.ox = JOY.x = e.clientX; JOY.oy = JOY.y = e.clientY;
    try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
});
cvs.addEventListener('pointermove', e => { if (JOY.on && e.pointerId === JOY.id) { JOY.x = e.clientX; JOY.y = e.clientY; } });
const joyEnd = e => { if (e.pointerId === JOY.id) JOY.on = false; };
cvs.addEventListener('pointerup', joyEnd); cvs.addEventListener('pointercancel', joyEnd);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

$('startBtn').addEventListener('click', startGame);
$('soundBtn').addEventListener('click', () => { audioInit(); const on = !(AU.sfxOn || AU.musOn); setSound(on, on); });
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
$('sfxBtn').addEventListener('click', () => setSound(!AU.sfxOn, AU.musOn));
$('musBtn').addEventListener('click', () => setSound(AU.sfxOn, !AU.musOn));
$('quitBtn').addEventListener('click', toTitle);
$('retryBtn').addEventListener('click', startGame);
$('homeBtn').addEventListener('click', toTitle);
$('contBtn').addEventListener('click', () => {
    G.endless = true; G.endT = 30; G.state = 'play'; AU.playing = true; showOnly(null);
    banner('끝없는 밤', '얼마나 더 버틸 수 있을까?');
});

/* ---------- 시작 ---------- */
let lastT = performance.now();
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
    if (G.state === 'play') update(dt);
    else if (G.state === 'title') { cam.x += 16 * dt; cam.y += 7 * dt; }
    render();
}
G.charIdx = clamp(store.get('char', 0) | 0, 0, CHARS.length - 1);
resize(); setSound(AU.sfxOn, AU.musOn); buildTitle(); renderBest();
if (document.fonts && document.fonts.load) document.fonts.load('12px "Do Hyeon"').then(() => { }).catch(() => { });
requestAnimationFrame(frame);
</script>
